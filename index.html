<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Idris Market</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f5f7;
  color:#222;
}

header{
  background:white;
  padding:15px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  color:#087f5b;
  font-size:24px;
  font-weight:bold;
}

.sell-btn{
  background:#087f5b;
  color:white;
  border:0;
  padding:11px 17px;
  border-radius:8px;
  font-weight:bold;
}

.hero{
  background:linear-gradient(135deg,#087f5b,#12a878);
  color:white;
  text-align:center;
  padding:45px 5%;
}

.hero h1{
  font-size:34px;
  margin-bottom:10px;
}

.hero p{
  margin-bottom:25px;
}

.search{
  max-width:650px;
  margin:auto;
  display:flex;
  background:white;
  border-radius:10px;
  overflow:hidden;
}

.search input{
  flex:1;
  border:0;
  outline:0;
  padding:15px;
  font-size:16px;
}

.search button{
  border:0;
  background:#222;
  color:white;
  padding:0 20px;
}

.section{
  padding:30px 5%;
}

.section h2{
  margin-bottom:20px;
}

.categories{
  display:flex;
  gap:12px;
  overflow-x:auto;
}

.category{
  min-width:110px;
  background:white;
  padding:16px 10px;
  border-radius:10px;
  text-align:center;
  cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.06);
}

.category span{
  display:block;
  font-size:28px;
  margin-bottom:7px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:18px;
}

.product{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  cursor:pointer;
}

.product img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.product-info{
  padding:15px;
}

.product-info h3{
  margin-bottom:8px;
}

.price{
  color:#087f5b;
  font-size:20px;
  font-weight:bold;
  margin-bottom:7px;
}

.location{
  color:#777;
  font-size:14px;
}

.details{
  display:none;
  padding:25px 5%;
}

.back{
  border:0;
  background:#222;
  color:white;
  padding:10px 15px;
  border-radius:7px;
  margin-bottom:20px;
  cursor:pointer;
}

.details-box{
  background:white;
  border-radius:12px;
  overflow:hidden;
  max-width:850px;
  margin:auto;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.details-box img{
  width:100%;
  max-height:450px;
  object-fit:cover;
}

.details-info{
  padding:25px;
}

.details-info h1{
  margin-bottom:10px;
}

.big-price{
  color:#087f5b;
  font-size:28px;
  font-weight:bold;
  margin:15px 0;
}

.description{
  line-height:1.6;
  margin:20px 0;
}

.contact{
  display:block;
  width:100%;
  padding:14px;
  background:#087f5b;
  color:white;
  text-align:center;
  border:0;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.form-container{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:200;
  justify-content:center;
  align-items:center;
  padding:15px;
}

.form-box{
  background:white;
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  padding:25px;
  border-radius:12px;
}

.close{
  float:right;
  border:0;
  background:none;
  font-size:25px;
  cursor:pointer;
}

.form-box input,
.form-box select,
.form-box textarea{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border:1px solid #ddd;
  border-radius:7px;
}

.form-box textarea{
  height:100px;
