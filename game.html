<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Idris Gamer Battle</title>
<style>
body{margin:0;background:#111;color:white;font-family:Arial;text-align:center}
#top{padding:12px;background:#222}
#game{position:relative;height:70vh;background:#183018;overflow:hidden}
#p,.e{position:absolute;width:42px;height:42px;border-radius:50%}
#p{background:#2196f3}
.e{background:#f44336}
.b{position:absolute;width:8px;height:8px;background:white;border-radius:50%}
button{padding:14px;margin:4px;border:0;border-radius:10px;font-weight:bold}
#fire{background:#f44336;color:white}
</style>
</head>
<body>

<div id="top">❤️ <span id="hp">100</span> | 🏆 <span id="score">0</span></div>

<div id="game">
<div id="p"></div>
</div>

<button onclick="move(0,-25)">▲</button><br>
<button onclick="move(-25,0)">◀</button>
<button onclick="move(0,25)">▼</button>
<button onclick="move(25,0)">▶</button>
<br>
<button id="fire" onclick="fire()">FIRE</button>

<script>
let p=document.getElementById("p"),g=document.getElementById("game");
let hp=100,score=0,x=150,y=150;

function pos(){
p.style.left=x+"px";
p.style.top=y+"px";
}

function move(a,b){
x=Math.max(0,Math.min(g.clientWidth-42,x+a));
y=Math.max(0,Math.min(g.clientHeight-42,y+b));
pos();
}

function enemy(){
let e=document.createElement("div");
e.className="e";
e.style.left=Math.random()*(g.clientWidth-42)+"px";
e.style.top=Math.random()*(g.clientHeight-42)+"px";
g.appendChild(e);
}

function fire(){
let b=document.createElement("div");
b.className="b";
b.style.left=(x+17)+"px";
b.style.top=(y-10)+"px";
g.appendChild(b);

let t=setInterval(()=>{
b.style.top=(b.offsetTop-8)+"px";

document.querySelectorAll(".e").forEach(e=>{
let dx=b.offsetLeft-e.offsetLeft;
let dy=b.offsetTop-e.offsetTop;

if(Math.hypot(dx,dy)<35){
e.remove();
b.remove();
score+=10;
document.getElementById("score").textContent=score;
clearInterval(t);
enemy();
}
});

if(b.offsetTop<0){
b.remove();
clearInterval(t);
}
},30);
}

pos();
enemy();
enemy();
enemy();
</script>

</body>
</html>
