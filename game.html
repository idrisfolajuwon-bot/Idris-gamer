<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Idris Gamer - Battle Arena</title>

<style>
* {
  box-sizing: border-box;
  touch-action: none;
}

body {
  margin: 0;
  background: #080810;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#hud {
  height: 60px;
  background: #151522;
  display: flex;
  justify-content: space-around;
  align-items: center;
  font-weight: bold;
}

#arena {
  position: relative;
  width: 100vw;
  height: calc(100vh - 60px);
  background: #171725;
  overflow: hidden;
}

.player,
.enemy {
  position: absolute;
  width: 45px;
  height: 45px;
  border-radius: 50%;
}

.player {
  background: #35a7ff;
  border: 4px solid white;
}

.enemy {
  background: #ff3b30;
  border: 4px solid #ffb3b3;
}

.bullet {
  position: absolute;
  width: 9px;
  height: 9px;
  background: white;
  border-radius: 50%;
}

#start {
  position: absolute;
  z-index: 20;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 16px 28px;
  border: none;
  border-radius: 12px;
  background: #ff3b30;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

#controls {
  position: fixed;
  bottom: 20px;
  left: 20px;
  z-index: 30;
}

.control {
  width: 55px;
  height: 55px;
  margin: 3px;
  border: none;
  border-radius: 12px;
  background: #333344;
  color: white;
  font-size: 22px;
}

#shoot {
  position: fixed;
  right: 25px;
  bottom: 35px;
  z-index: 30;
  width: 75px;
  height: 75px;
  border-radius: 50%;
  border: 3px solid white;
  background: #ff3b30;
  color: white;
  font-weight: bold;
}
</style>
</head>
